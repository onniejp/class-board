<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Game Table</title>

<style>
body { margin:0; font-family:sans-serif; background:#222; color:white; }

/* Decks */
#deck-area {
  position: fixed;
  bottom: 80px;
  left: 16px;
  display: flex;
  gap: 10px;
}

.deck {
  width: 90px;
  height: 130px;
  background:#444;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:pointer;
  font-size:12px;
}

/* Cards */
.card {
  position:fixed;
  background:white;
  color:black;
  padding:10px;
  border-radius:8px;
  top:40%;
  left:40%;
  width:200px;
}

.close {
  position:absolute;
  top:4px;
  right:6px;
  cursor:pointer;
}

/* Hand */
#hand {
  position:fixed;
  right:10px;
  bottom:100px;
  background:#111;
  padding:10px;
  width:200px;
}
</style>
</head>

<body>

<div id="deck-area"></div>

<div id="hand">
  <div style="font-size:10px; margin-bottom:6px;">Your Hand</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import {
  getDatabase, ref, set, onValue, remove
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://onnie-s-board-game-default-rtdb.firebaseio.com"
});

const db = getDatabase(app);
const ROOM_ID = "main";

const decksRef = ref(db, `rooms/${ROOM_ID}/decks`);
const deckNamesRef = ref(db, `rooms/${ROOM_ID}/deckNames`);
const activeCardRef = ref(db, `rooms/${ROOM_ID}/activeCard`);

let decks = {};
let deckNames = {};

/* ─────────── Firebase listeners ─────────── */

onValue(decksRef, s => {
  decks = s.val() || {};
  updateDeckUI();
});

onValue(deckNamesRef, s => {
  deckNames = s.val() || {};
  updateDeckUI();
});

onValue(activeCardRef, s => {
  document.querySelectorAll('.card').forEach(c => c.remove());
  const data = s.val();
  if (!data) return;
  showCard(data);
});

/* ─────────── Deck UI ─────────── */

function updateDeckUI() {
  const area = document.getElementById('deck-area');
  area.innerHTML = '';

  Object.entries(decks).forEach(([deckId, pile]) => {

    const safePile = Array.isArray(pile) ? pile : [];

    const deck = document.createElement('div');
    deck.className = 'deck';
    deck.textContent = `${deckNames[deckId] || "Deck"} (${safePile.length})`;

    deck.onclick = () => draw(deckId);

    // close button
    const close = document.createElement('div');
    close.className = 'close';
    close.textContent = "✖";
    close.onclick = (e) => {
      e.stopPropagation();
      remove(ref(db, `rooms/${ROOM_ID}/decks/${deckId}`));
      remove(ref(db, `rooms/${ROOM_ID}/deckNames/${deckId}`));
    };

    // shuffle button
    const shuffleBtn = document.createElement('div');
    shuffleBtn.textContent = "🔄";
    shuffleBtn.style.position = "absolute";
    shuffleBtn.style.bottom = "4px";
    shuffleBtn.style.right = "6px";

    shuffleBtn.onclick = (e) => {
      e.stopPropagation();
      const arr = [...safePile];
      shuffle(arr);
      set(ref(db, `rooms/${ROOM_ID}/decks/${deckId}`), arr);
    };

    deck.appendChild(close);
    deck.appendChild(shuffleBtn);

    area.appendChild(deck);
  });
}

/* ─────────── DRAW (correct loop logic) ─────────── */

function draw(deckId) {
  const pile = decks[deckId];
  if (!pile || !pile.length) return;

  const card = pile[0];                 // take top
  const rotated = [...pile.slice(1), card]; // rotate

  set(ref(db, `rooms/${ROOM_ID}/decks/${deckId}`), rotated);
  set(activeCardRef, { ...card, deckId });
}

/* ─────────── CARD DISPLAY ─────────── */

function showCard(card) {
  const el = document.createElement('div');
  el.className = "card";

  el.innerHTML = `
    <div class="close">✖</div>
    <div><b>${card.top}</b></div>
    <div>${card.bottom}</div>
  `;

  el.querySelector('.close').onclick = () => {
    if (card.special) {
      addCardToHand(card);  // ✅ visual copy ONLY
    }
    set(activeCardRef, null);
  };

  document.body.appendChild(el);
}

/* ─────────── HAND (SAFE VERSION) ─────────── */

function addCardToHand(card) {
  const hand = document.getElementById('hand');

  const mini = document.createElement('div');
  mini.textContent = card.top;
  mini.style.background="#fff";
  mini.style.color="#000";
  mini.style.marginBottom="6px";
  mini.style.cursor="pointer";

  // reopen card
  mini.onclick = () => showCard(card);

  // remove from hand (no DB interaction)
  mini.oncontextmenu = (e) => {
    e.preventDefault();
    mini.remove();
  };

  hand.appendChild(mini);
}

/* ─────────── UTIL ─────────── */

function shuffle(a) {
  for (let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()* (i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}
