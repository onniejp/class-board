<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Board Table</title>

<style>
body { margin:0; background:#2b2b2b; color:white; font-family:sans-serif; }

/* Deck UI */
#deck-area {
  position: fixed;
  bottom: 80px;
  left: 20px;
  display: flex;
  gap: 12px;
}

.deck {
  width: 90px;
  height: 130px;
  background: #444;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
  cursor:pointer;
  border-radius:8px;
}

/* Card */
.card {
  position: fixed;
  width: 220px;
  background: white;
  color: black;
  padding: 10px;
  border-radius: 10px;
  top: 30%;
  left: 40%;
}

.close {
  position:absolute;
  top:5px;
  right:8px;
  cursor:pointer;
}

/* Hand */
#hand {
  position: fixed;
  right: 20px;
  bottom: 120px;
  width: 200px;
  background:#111;
  padding:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<div id="deck-area"></div>

<div id="hand">
  <div style="font-size:10px">Your Hand</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://onnie-s-board-game-default-rtdb.firebaseio.com"
});

const db = getDatabase(app);
const ROOM = "main";

const decksRef = ref(db, `rooms/${ROOM}/decks`);
const namesRef = ref(db, `rooms/${ROOM}/deckNames`);
const activeRef = ref(db, `rooms/${ROOM}/activeCard`);

let decks = {};
let names = {};

/* ---------- Firebase ---------- */

onValue(decksRef, s => {
  decks = s.val() || {};
  drawDecks();
});

onValue(namesRef, s => {
  names = s.val() || {};
  drawDecks();
});

onValue(activeRef, s => {
  document.querySelectorAll('.card').forEach(c => c.remove());
  const c = s.val();
  if (c) showCard(c);
});

/* ---------- Deck display ---------- */

function drawDecks() {
  const area = document.getElementById("deck-area");
  area.innerHTML = "";

  for (let id in decks) {
    const pile = Array.isArray(decks[id]) ? decks[id] : [];

    const d = document.createElement("div");
    d.className = "deck";
    d.textContent = (names[id] || "Deck") + " (" + pile.length + ")";

    d.onclick = () => drawCard(id);

    // remove
    const x = document.createElement("div");
    x.textContent = "✖";
    x.className = "close";
    x.onclick = (e) => {
      e.stopPropagation();
      remove(ref(db, `rooms/${ROOM}/decks/${id}`));
      remove(ref(db, `rooms/${ROOM}/deckNames/${id}`));
    };

    d.appendChild(x);
    area.appendChild(d);
  }
}

/* ---------- draw (loop mode) ---------- */

function drawCard(id) {
  const pile = decks[id];
  if (!pile || !pile.length) return;

  const top = pile[0];
  const rotated = [...pile.slice(1), top];

  set(ref(db, `rooms/${ROOM}/decks/${id}`), rotated);
  set(activeRef, { ...top, deckId:id });
}

/* ---------- show card ---------- */

function showCard(c) {
  const el = document.createElement("div");
  el.className = "card";

  el.innerHTML = `
    <div class="close">✖</div>
    <b>${c.top}</b><br>
    ${c.bottom}
  `;

  el.querySelector(".close").onclick = () => {

    // ✅ FIXED — NO playerHand.push()
    if (c.special) {
      handAdd(c);
    }

    set(activeRef, null);
  };

  document.body.appendChild(el);
}

/* ---------- hand ---------- */

function handAdd(c) {
  const hand = document.getElementById("hand");

  const m = document.createElement("div");
  m.textContent = c.top;
  m.style.background = "#fff";
  m.style.color = "#000";
  m.style.margin = "4px 0";
  m.style.cursor = "pointer";

  m.onclick = () => showCard(c);

  m.oncontextmenu = (e) => {
    e.preventDefault();
    m.remove();
  };

  hand.appendChild(m);
}

/* ---------- demo loader ---------- */

function seed() {
  const d = [
    { top:"Card A", bottom:"Alpha" },
    { top:"Card B", bottom:"Beta" },
    { top:"Card C", bottom:"Gamma", special:true }
  ];

  set(ref(db, `rooms/${ROOM}/decks/test`), d);
  set(ref(db, `rooms/${ROOM}/deckNames/test`), "Test Deck");

  document.getElementById("hand").innerHTML =
    '<div style="font-size:10px">Your Hand</div>';
}

const btn = document.createElement("button");
btn.textContent = "Load Deck";
btn.style.position="fixed";
btn.style.top="10px";
btn.style.left="10px";
btn.onclick = seed;
document.body.appendChild(btn);

</script>
</body>
</html>
