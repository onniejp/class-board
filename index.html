<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Board Game Table</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --wood-dark:#3B2210;
  --gold:#D4A017;
  --gold-light:#F0C040;
  --cream:#F5ECD7;
  --piece-size:56px;
}

html,body{
  width:100%; height:100%;
  overflow:hidden;
  background:var(--wood-dark);
  font-family:'Cinzel', serif;
  color:var(--cream);
}

/* ── TABLE / BOARD ───────────────────────── */
#table-frame{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}
#board-wrap{
  width:min(96vw,calc(96vh*16/9));
  height:min(54vw,96vh);
  border-radius:16px;
  box-shadow:0 30px 80px rgba(0,0,0,.8);
}
#board{
  position:relative;
  width:100%; height:100%;
  border-radius:10px;
  overflow:hidden;
  background:radial-gradient(#3A6B1E,#1E3A0F);
}
#board::after{
  content:"";
  position:absolute;
  inset:8px;
  border:2px solid rgba(212,160,23,.35);
  border-radius:6px;
}

/* ── PIECES ─────────────────────────────── */
.piece{
  position:absolute;
  width:var(--piece-size);
  height:var(--piece-size);
  border-radius:50%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  cursor:grab;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
}
.piece.dragging{transform:translate(-50%,-50%) scale(1.18);}

/* ── HUD / PANEL ────────────────────────── */
#hud{
  position:fixed;
  top:16px; left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:12px;
  background:rgba(30,15,5,.9);
  padding:8px 20px;
  border-radius:30px;
  border:1px solid rgba(212,160,23,.4);
  z-index:300;
}
#panel{
  position:fixed;
  right:0; top:0; bottom:0;
  width:200px;
  background:rgba(20,10,3,.95);
  padding:70px 14px;
  transform:translateX(100%);
  transition:.3s;
  z-index:250;
}
#panel.open{transform:translateX(0);}
.panel-btn{
  width:100%;
  margin-top:6px;
  background:rgba(212,160,23,.15);
  border:1px solid rgba(212,160,23,.4);
  color:var(--cream);
  padding:8px;
  cursor:pointer;
  border-radius:6px;
  font-family:'Cinzel',serif;
}

/* ── DICE UI ───────────────────────────── */
#local-die{
  position:fixed;
  bottom:16px; left:16px;
  padding:8px 12px;
  border-radius:14px;
  background:rgba(20,10,3,.9);
  border:1px solid rgba(212,160,23,.4);
  z-index:400;
}
#dice-row{display:flex; gap:6px;}
.die{cursor:pointer; white-space:nowrap;}
.dice-controls{
  display:flex;
  gap:6px;
  margin-top:6px;
  justify-content:center;
}
.dice-controls button{
  width:28px; height:28px;
  border-radius:6px;
  border:1px solid rgba(212,160,23,.5);
  background:rgba(20,10,3,.85);
  color:var(--gold-light);
  cursor:pointer;
}
</style>
</head>

<body>

<!-- HUD -->
<div id="hud">
  <span id="player-count">connecting…</span>
</div>

<!-- Dice -->
<div id="local-die">
  <div id="dice-row"></div>
  <div class="dice-controls">
    <button id="add-die">+</button>
    <button id="remove-die">−</button>
  </div>
</div>

<!-- Side Panel -->
<button id="toggle-panel" style="position:fixed;top:16px;right:16px;">⚙</button>
<div id="panel">
  <button class="panel-btn" id="add-piece-btn">＋ Place Piece</button>
  <button class="panel-btn" id="clear-btn">🗑 Clear Pieces</button>
</div>

<!-- Board -->
<div id="table-frame">
  <div id="board-wrap">
    <div id="board"></div>
  </div>
</div>

<!-- Firebase + Game Logic -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import {
  getDatabase, ref, set, onValue, push, remove, onDisconnect, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyBCdKMXJEgpZnMK7kPnHbbZ_gabviXEeQw",
  authDomain:"onnie-s-board-game.firebaseapp.com",
  databaseURL:"https://onnie-s-board-game-default-rtdb.firebaseio.com",
  projectId:"onnie-s-board-game",
  appId:"1:258517591017:web:5031387457578bfbf9e178"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

function getRoomId(){
  if(!location.hash){
    location.hash=Math.random().toString(36).slice(2,8).toUpperCase();
  }
  return location.hash.slice(1);
}
const ROOM_ID=getRoomId();

/* ── DICE (SYNCED) ─────────────────────── */
const diceRef=ref(db,`rooms/${ROOM_ID}/dice`);
const diceRow=document.getElementById('dice-row');
const dice={};

function renderDie(id,value){
  let el=dice[id];
  if(!el){
    el=document.createElement('div');
    el.className='die';
    el.textContent='🎲 '+value;
    el.onclick=()=>rollDie(id);
    dice[id]=el;
    diceRow.appendChild(el);
  }else{
    el.textContent='🎲 '+value;
  }
}
function rollDie(id){
  set(ref(db,`rooms/${ROOM_ID}/dice/${id}`),
      {value:Math.floor(Math.random()*6)+1});
}
onValue(diceRef,snap=>{
  const data=snap.val()||{};
  Object.keys(dice).forEach(id=>{
    if(!data[id]){dice[id].remove(); delete dice[id];}
  });
  Object.entries(data).forEach(([id,d])=>renderDie(id,d.value));
});

document.getElementById('add-die').onclick=()=>{
  set(push(diceRef),{value:Math.floor(Math.random()*6)+1});
};
document.getElementById('remove-die').onclick=()=>{
  const ids=Object.keys(dice);
  if(ids.length)
    remove(ref(db,`rooms/${ROOM_ID}/dice/${ids.pop()}`));
};

/* ── PRESENCE ─────────────────────────── */
const presenceRef=ref(db,`rooms/${ROOM_ID}/presence`);
const me=push(presenceRef);
set(me,{joined:serverTimestamp()});
onDisconnect(me).remove();
onValue(presenceRef,snap=>{
  const n=snap.size||0;
  document.getElementById('player-count').textContent=
    `${n} player${n===1?'':'s'}`;
});
</script>

</body>
</html>
