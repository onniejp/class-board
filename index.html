<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Board Game Table</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&display=swap');

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

:root{
  --wood-dark:#3B2210;
  --gold-light:#F0C040;
  --cream:#F5ECD7;
  --piece-size:56px;
}

html,body{
  width:100%; height:100%;
  overflow:hidden;
  background:var(--wood-dark);
  font-family:'Cinzel', serif;
  color:var(--cream);
  user-select:none;
}

/* ── LOCAL DIE ───────────────────────── */
#local-die{
  position:fixed;
  bottom:16px;
  left:16px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  background:rgba(20,10,3,.9);
  border:1px solid rgba(212,160,23,.4);
  border-radius:14px;
  z-index:400;
  box-shadow:0 4px 14px rgba(0,0,0,.6);
  font-size:20px;
}
#local-die .die-emoji{cursor:pointer;}
#local-die .die-value{
  font-size:18px;
  color:var(--gold-light);
  min-width:1ch;
}
</style>
</head>

<body>

<!-- Dice UI -->
<div id="local-die">
  <span class="die-emoji">🎲</span>
  <span class="die-value">–</span>
</div>

<!-- Firebase + Game Logic -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import {
  getDatabase, ref, set, onValue, push, remove, onDisconnect, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCdKMXJEgpZnMK7kPnHbbZ_gabviXEeQw",
  authDomain: "onnie-s-board-game.firebaseapp.com",
  databaseURL: "https://onnie-s-board-game-default-rtdb.firebaseio.com",
  projectId: "onnie-s-board-game",
  appId: "1:258517591017:web:5031387457578bfbf9e178"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* ── ROOM ID ───────────────────────────── */
function getRoomId(){
  if(!location.hash){
    const id=Math.random().toString(36).slice(2,8).toUpperCase();
    location.hash=id; return id;
  }
  return location.hash.slice(1);
}
const ROOM_ID = getRoomId();

/* ── DICE SYNC ──────────────────────────── */
const dieRef      = ref(db, `rooms/${ROOM_ID}/die`);
const dieEmojiEl  = document.querySelector('#local-die .die-emoji');
const dieValueEl  = document.querySelector('#local-die .die-value');

/* Click → roll → write to Firebase */
dieEmojiEl.addEventListener('click', () => {
  const roll = Math.floor(Math.random() * 6) + 1;
  set(dieRef, { value: roll });
});

/* Firebase → update all clients */
onValue(dieRef, snap => {
  const data = snap.val();
  if (data && typeof data.value === 'number') {
    dieValueEl.textContent = data.value;
  }
});

/* ── Presence (unchanged, minimal) ───────── */
const presenceRef = ref(db, `rooms/${ROOM_ID}/presence`);
const myPresenceRef = push(presenceRef);
set(myPresenceRef, { joined: serverTimestamp() });
onDisconnect(myPresenceRef).remove();
</script>

</body>
</html>
