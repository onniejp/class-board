<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Board Game Table</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --wood:#5C3A1E; --wood-dark:#3B2210;
  --felt:#2D5016; --gold:#D4A017; --gold-light:#F0C040;
  --cream:#F5ECD7; --piece-size:56px;
}

html, body {
  width:100%; height:100%;
  background:var(--wood-dark);
  font-family:'Cinzel', serif;
  color:var(--cream);
  overflow:hidden;
  user-select:none;
}

/* ── TABLE / BOARD ───────────────────────── */
#table-frame {
  position:fixed; inset:0;
  background:radial-gradient(ellipse,#7A4A25,#2A1508);
  display:flex;
  align-items:center;
  justify-content:center;
}
#board-wrap {
  width:min(96vw,calc(96vh*16/9));
  height:min(54vw,96vh);
  border-radius:16px;
  box-shadow:0 30px 80px rgba(0,0,0,.8);
}
#board {
  position:relative;
  width:100%; height:100%;
  border-radius:10px;
  overflow:hidden;
  background:radial-gradient(#3A6B1E,#1E3A0F);
}
#board::after {
  content:"";
  position:absolute;
  inset:8px;
  border:2px solid rgba(212,160,23,.35);
  border-radius:6px;
}

/* ── PIECES ─────────────────────────────── */
.piece {
  position:absolute;
  width:var(--piece-size);
  height:var(--piece-size);
  border-radius:50%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  cursor:grab;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
}
.piece.dragging { transform:translate(-50%,-50%) scale(1.18); }

.piece[data-color="red"]{background:#c0392b;}
.piece[data-color="blue"]{background:#2980b9;}
.piece[data-color="white"]{background:#ecf0f1;color:#222;}
.piece[data-color="black"]{background:#1c2833;}
.piece[data-color="green"]{background:#229954;}
.piece[data-color="yellow"]{background:#f1c40f;color:#222;}

/* ── HUD / PANEL ────────────────────────── */
#hud {
  position:fixed;
  top:16px; left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:12px;
  background:rgba(30,15,5,.9);
  padding:8px 20px;
  border-radius:30px;
  border:1px solid rgba(212,160,23,.4);
  z-index:300;
}

#panel {
  position:fixed;
  right:0; top:0; bottom:0;
  width:200px;
  background:rgba(20,10,3,.95);
  padding:70px 14px;
  transform:translateX(100%);
  transition:.3s;
  z-index:250;
}
#panel.open{transform:translateX(0);}
#panel h2{font-size:11px;color:var(--gold);margin-top:6px;}
.panel-btn{
  width:100%;
  margin-top:6px;
  background:rgba(212,160,23,.15);
  border:1px solid rgba(212,160,23,.4);
  color:var(--cream);
  padding:8px;
  cursor:pointer;
  border-radius:6px;
  font-family:'Cinzel',serif;
}

#toggle-panel{
  position:fixed;
  top:16px; right:16px;
  width:40px; height:40px;
  border-radius:50%;
  cursor:pointer;
  background:rgba(20,10,3,.9);
  border:1px solid rgba(212,160,23,.4);
  color:var(--gold-light);
  z-index:400;
}

/* ── DICE ───────────────────────────────── */
#dice-area{
  position:fixed;
  bottom:18px;
  left:18px;
  display:flex;
  gap:10px;
  z-index:400;
}
.die{
  width:56px;
  height:56px;
  border-radius:12px;
  background:rgba(20,10,3,.9);
  border:2px solid rgba(212,160,23,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.6);
}
</style>
</head>

<body>

<div id="hud">
  <h1>Board Game Table</h1>
  <span id="player-count">connecting…</span>
</div>

<button id="toggle-panel">⚙</button>

<div id="panel">
  <h2>Actions</h2>
  <button class="panel-btn" id="add-piece-btn">＋ Place Piece</button>
  <button class="panel-btn" id="clear-btn">🗑 Clear Pieces</button>

  <button class="panel-btn" id="add-die-btn">＋ Die</button>
  <button class="panel-btn" id="remove-die-btn" style="display:none">− Die</button>
</div>

<div id="table-frame">
  <div id="board-wrap">
    <div id="board"></div>
  </div>
</div>

<div id="dice-area"></div>

<!-- ── FIREBASE / GAME LOGIC ───────────────────────── -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue, push, remove, onDisconnect, serverTimestamp } 
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCdKMXJEgpZnMK7kPnHbbZ_gabviXEeQw",
  authDomain: "onnie-s-board-game.firebaseapp.com",
  databaseURL: "https://onnie-s-board-game-default-rtdb.firebaseio.com",
  projectId: "onnie-s-board-game",
  appId: "1:258517591017:web:5031387457578bfbf9e178"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ROOM = location.hash.slice(1) || (location.hash = Math.random().toString(36).slice(2,8).toUpperCase());

const board = document.getElementById('board');
const diceArea = document.getElementById('dice-area');
const addDieBtn = document.getElementById('add-die-btn');
const removeDieBtn = document.getElementById('remove-die-btn');
const panel = document.getElementById('panel');

document.getElementById('toggle-panel').onclick =
  () => panel.classList.toggle('open');

/* ── DICE ─────────────────────────── */
const dice = {};
const diceRef = ref(db, `rooms/${ROOM}/dice`);

function createDie(id, data) {
  const el = document.createElement('div');
  el.className = 'die';
  el.textContent = data.value ?? '🎲';
  el.onclick = () => rollDie(id);
  diceArea.appendChild(el);
  dice[id] = { el };
}

function rollDie(id) {
  const value = Math.floor(Math.random()*6)+1;
  set(ref(db, `rooms/${ROOM}/dice/${id}`), { value });
}

onValue(diceRef, snap => {
  const data = snap.val() || {};
  Object.keys(dice).forEach(id=>{
    if(!data[id]){ dice[id].el.remove(); delete dice[id]; }
  });
  Object.entries(data).forEach(([id,val])=>{
    dice[id] ? dice[id].el.textContent=val.value : createDie(id,val);
  });
  removeDieBtn.style.display =
    Object.keys(dice).length ? 'block' : 'none';
});

addDieBtn.onclick = () => {
  set(push(diceRef), { value:'🎲' });
};

removeDieBtn.onclick = () => {
  const ids = Object.keys(dice);
  if (ids.length)
    remove(ref(db, `rooms/${ROOM}/dice/${ids.pop()}`));
};
</script>

</body>
</html>
